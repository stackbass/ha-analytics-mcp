name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Every other job depends on this one: a tag that doesn't match
  # package.json must not publish anything, to either npm or GHCR.
  verify-version:
    name: Verify tag matches package.json version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assert tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME (=> $tag) does not match package.json version $version" >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version $version"

  npm:
    name: Publish to npm
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing: GitHub mints a short-lived token per run that
      # npm verifies against the package's configured trusted publisher — no
      # stored NPM_TOKEN, and provenance attestations are generated
      # automatically.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted publishing requires npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # `prepublishOnly` runs `npm run build`, producing dist/ (the only
      # compiled output listed in package.json "files"). Skip a version
      # that's already on npm so a re-run after a partial failure is safe.
      - name: Publish (skips a version already on npm)
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "ha-analytics-mcp@$version" version >/dev/null 2>&1; then
            echo "ha-analytics-mcp@$version is already on npm — skipping publish."
          else
            npm publish --access public
          fi

  docker:
    name: Build and push Docker image
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      # Build to the local daemon (single-arch, native runner platform) and
      # exercise it as an MCP stdio server before anything is pushed: a
      # builder/runtime drift in the Dockerfile must fail here, not on a
      # user's machine. The multi-arch push below reuses this layer cache, so
      # it costs seconds, not a second build.
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ha-analytics-mcp:smoke

      # The server needs no live Home Assistant to start on stdio: HA calls
      # made during startup prefetch are logged and swallowed on failure (see
      # cache.ts prefetchStartupData), so dummy HA_URL/HA_TOKEN are enough to
      # reach "server running" and answer an MCP `initialize` request. Verified
      # locally against this same image with:
      #   printf '%s\n' "$request" | docker run --rm -i \
      #     -e HA_URL=https://dummy.invalid -e HA_TOKEN=dummy ha-analytics-mcp:smoke
      # which prints the initialize result and exits 0 once stdin closes.
      - name: Smoke-test the image (stdio MCP initialize) before pushing
        run: |
          set -eu
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0.0.1"}}}'
          response="$(printf '%s\n' "$request" | docker run --rm -i \
            -e HA_URL=https://smoke-test.invalid \
            -e HA_TOKEN=smoke-test-token \
            ha-analytics-mcp:smoke)"
          echo "$response"
          echo "$response" | grep -q '"protocolVersion"' \
            || { echo "smoke test: no initialize result found in server output" >&2; exit 1; }

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # Single manifest list per tag, no separate SBOM/provenance
          # attestation objects — those inflate what gets pushed/pulled for a
          # small server image.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
